version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: vayyuedge-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROCESSING_MODE=local
      - ASR_ADAPTER=mock
      - TRANSLATION_ADAPTER=mock
      - TTS_ADAPTER=mock
      - PORT=8000
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vayyuedge-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
